- name: Angular Setup
  # You may pin to the exact commit or the version.
  # uses: mayurrawte/github-angular-actions@e4678e9a4e3720745a90de753757b05ae9f43595
  uses: mayurrawte/github-angular-actions@v2.0.0
  with:
    # Angular CLI version to install (e.g. 17.3.8, 18.0.0, or latest)
    version: # optional, default is latest
    # Node.js version to use (e.g. 22, 20, 18)
    node-version: # optional, default is 22
    # Package manager to cache and use for the global CLI install: npm, yarn, or pnpm
    package-manager: # optional, default is npm
    # Path to the lock file for caching (e.g. packages/app/package-lock.json). Defaults to repo root.
    cache-dependency-path: # optional, default is 
    # Enable package manager caching. Set to false to disable (e.g. if no lock file exists).
    cache: # optional, default is true
